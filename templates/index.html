<!DOCTYPE html>
<html>
<head>
    <title>Menu Utama</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            text-align:center;
            background:#f5f5f5;
        }

        h1{
            color:#1976d2;
            font-size:60px;
        }

        .menu{
            width:80%;
            margin:20px auto;
        }

        .menu a{
            display:block;
            background:#2196f3;
            color:white;
            text-decoration:none;
            padding:20px;
            margin:20px 0;
            font-size:35px;
            border-radius:5px;
        }

        .menu a:hover{
            background:#1976d2;
        }
    </style>
</head>
<body>

<h1>MENU UTAMA</h1>

<div class="menu">
    <a href="/barang">Data Barang</a>
    <a href="/penjualan">Data Penjualan</a>
    <a href="/pembelian">Data Pembelian</a>
</div>

</body>
</html>
